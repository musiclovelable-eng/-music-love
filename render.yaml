services:
  - type: web
    name: music-love-label
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    # Render injects HOSTNAME=<container-id>; Next standalone must bind all interfaces.
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: music-love-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: STORAGE_DRIVER
        value: postgres
      - key: LOCAL_STORAGE_DIR
        value: /tmp/music-love-storage
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://placeholder.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: placeholder
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: placeholder

databases:
  - name: music-love-db
    plan: free
    databaseName: music_love
    user: music_love
    region: frankfurt
